name: Build Dell SMM x86 via NuGet WDK

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022

    steps:
      - name: Download NuGet
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile "$env:GITHUB_WORKSPACE\nuget.exe"

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\nuget.exe")) {
            throw "nuget.exe download failed"
          }

          Write-Host "NuGet downloaded."

      - name: Download official Microsoft x86 WDK package
        shell: powershell
        run: |
          $nuget = "$env:GITHUB_WORKSPACE\nuget.exe"
          $packages = "$env:GITHUB_WORKSPACE\packages"

          & $nuget install Microsoft.Windows.WDK.x86 `
            -Version 10.0.26100.6584 `
            -OutputDirectory $packages `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "WDK NuGet download failed"
          }

          Write-Host ""
          Write-Host "=== DOWNLOADED PACKAGES ==="

          Get-ChildItem $packages -Directory |
            Select-Object Name |
            Format-Table -AutoSize

      - name: Locate WDK and SDK build files
        shell: powershell
        run: |
          $packages = "$env:GITHUB_WORKSPACE\packages"

          $wdkProps = Get-ChildItem $packages -Recurse `
            -Filter "Microsoft.Windows.WDK.x86.props" |
            Select-Object -First 1

          $wdkTargets = Get-ChildItem $packages -Recurse `
            -Filter "Microsoft.Windows.WDK.x86.targets" |
            Select-Object -First 1

          $sdkProps = Get-ChildItem $packages -Recurse `
            -Filter "Microsoft.Windows.SDK.cpp.props" |
            Select-Object -First 1

          $sdkTargets = Get-ChildItem $packages -Recurse `
            -Filter "Microsoft.Windows.SDK.cpp.targets" |
            Select-Object -First 1

          $sdkX86Props = Get-ChildItem $packages -Recurse `
            -Filter "Microsoft.Windows.SDK.cpp.x86.props" |
            Select-Object -First 1

          $sdkX86Targets = Get-ChildItem $packages -Recurse `
            -Filter "Microsoft.Windows.SDK.cpp.x86.targets" |
            Select-Object -First 1

          Write-Host "=== WDK PROPS ==="
          Write-Host $wdkProps.FullName

          Write-Host "=== WDK TARGETS ==="
          Write-Host $wdkTargets.FullName

          Write-Host "=== SDK PROPS ==="
          Write-Host $sdkProps.FullName

          Write-Host "=== SDK TARGETS ==="
          Write-Host $sdkTargets.FullName

          Write-Host "=== SDK X86 PROPS ==="
          Write-Host $sdkX86Props.FullName

          Write-Host "=== SDK X86 TARGETS ==="
          Write-Host $sdkX86Targets.FullName

          if (-not $wdkProps -or
              -not $wdkTargets -or
              -not $sdkProps -or
              -not $sdkTargets -or
              -not $sdkX86Props -or
              -not $sdkX86Targets) {
            throw "One or more NuGet WDK/SDK build files were not found"
          }

          "WDK_PROPS=$($wdkProps.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "WDK_TARGETS=$($wdkTargets.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SDK_PROPS=$($sdkProps.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SDK_TARGETS=$($sdkTargets.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SDK_X86_PROPS=$($sdkX86Props.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SDK_X86_TARGETS=$($sdkX86Targets.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify ntddk and x86 libraries
        shell: powershell
        run: |
          $packages = "$env:GITHUB_WORKSPACE\packages"

          Write-Host "=== NTDDK.H ==="

          $ntddk = Get-ChildItem $packages -Recurse `
            -Filter "ntddk.h" |
            Select-Object -First 10

          $ntddk |
            Select-Object FullName |
            Format-Table -AutoSize

          if (-not $ntddk) {
            throw "ntddk.h not found in NuGet WDK"
          }

          Write-Host ""
          Write-Host "=== X86 KM LIBRARIES ==="

          $libs = Get-ChildItem $packages -Recurse `
            -Filter "*.lib" |
            Where-Object {
              $_.FullName -match "\\km\\x86\\" -or
              $_.FullName -match "\\x86\\km\\"
            } |
            Select-Object -First 30

          $libs |
            Select-Object FullName |
            Format-Table -AutoSize

          if (-not $libs) {
            throw "x86 kernel libraries not found"
          }

      - name: Download original Dell SMM driver source
        shell: powershell
        run: |
          git clone --depth 1 `
            https://github.com/424778940z/bzh-windrv-dell-smm-io.git `
            src

          Set-Location src

          Write-Host "Source commit:"
          git rev-parse HEAD

      - name: Patch driver project for NuGet WDK x86
        shell: powershell
        run: |
          $project = "$env:GITHUB_WORKSPACE\src\bzh_dell_smm_io\bzh_dell_smm_io.vcxproj"

          $text = Get-Content $project -Raw

          $cppDefault = '<Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />'
          $cppTargets = '<Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />'

          if (-not $text.Contains($cppDefault)) {
            throw "Microsoft.Cpp.Default.props import not found"
          }

          if (-not $text.Contains($cppTargets)) {
            throw "Microsoft.Cpp.targets import not found"
          }

          $props = @"
            <Import Project="$env:WDK_PROPS" />
            <Import Project="$env:SDK_X86_PROPS" />
            <Import Project="$env:SDK_PROPS" />
          "@

          $targets = @"
            <Import Project="$env:SDK_TARGETS" />
            <Import Project="$env:SDK_X86_TARGETS" />
            <Import Project="$env:WDK_TARGETS" />
          "@

          $text = $text.Replace(
            $cppDefault,
            "$props`r`n  $cppDefault"
          )

          $text = $text.Replace(
            $cppTargets,
            "$cppTargets`r`n$targets"
          )

          Set-Content `
            -Path $project `
            -Value $text `
            -Encoding UTF8

          Write-Host "=== PATCHED PROJECT IMPORTS ==="

          Select-String `
            -Path $project `
            -Pattern "Microsoft.Windows.WDK|Microsoft.Windows.SDK" |
            ForEach-Object { $_.Line }

      - name: Build Release Win32
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild not found"
          }

          Write-Host "Using:"
          Write-Host $msbuild

          $project = "$env:GITHUB_WORKSPACE\src\bzh_dell_smm_io\bzh_dell_smm_io.vcxproj"

          & $msbuild `
            $project `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:TargetVersion=Windows10 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:SignMode=Off `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "x86 driver build failed"
          }

      - name: Collect and verify driver
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\artifact" `
            -Force |
            Out-Null

          $sysfiles = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\src" `
            -Recurse `
            -File `
            -Filter "*.sys"

          if (-not $sysfiles) {
            throw "No SYS driver produced"
          }

          foreach ($sys in $sysfiles) {
            Copy-Item `
              $sys.FullName `
              "$env:GITHUB_WORKSPACE\artifact" `
              -Force
          }

          foreach ($sys in (Get-ChildItem "$env:GITHUB_WORKSPACE\artifact" -Filter "*.sys")) {

            Write-Host ""
            Write-Host "=================================="
            Write-Host "FILE: $($sys.Name)"
            Write-Host "=================================="

            $bytes = [System.IO.File]::ReadAllBytes($sys.FullName)

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

            Write-Host ("PE machine: 0x{0:X4}" -f $machine)

            if ($machine -eq 0x014C) {
              Write-Host "Architecture: x86 / i386 -- CORRECT"
            }
            elseif ($machine -eq 0x8664) {
              throw "Built driver is x64 instead of x86"
            }
            else {
              throw ("Unexpected PE machine type: 0x{0:X4}" -f $machine)
            }

            $hash = Get-FileHash `
              $sys.FullName `
              -Algorithm SHA256

            Write-Host "SHA256:"
            Write-Host $hash.Hash
          }

      - name: Upload x86 driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: dell-smm-x86-nuget
          path: artifact
          if-no-files-found: error
