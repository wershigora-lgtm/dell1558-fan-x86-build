name: Build Dell Studio 1558 x86 RPM driver

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Verify preinstalled NuGet
        shell: powershell
        run: |
          Write-Host "=== NUGET ==="
          where.exe nuget
          nuget help | Select-Object -First 5

          if ($LASTEXITCODE -ne 0) {
            throw "Preinstalled NuGet is not available"
          }

      - name: Get Windows 10 x86 WDK 19041
        shell: powershell
        run: |
          $packages = "$env:GITHUB_WORKSPACE\packages"

          nuget install Microsoft.Windows.WDK.x86 `
            -Version 10.0.19041.5 `
            -OutputDirectory $packages `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "WDK x86 19041 download failed"
          }

          Write-Host ""
          Write-Host "=== PACKAGES ==="

          Get-ChildItem $packages -Directory |
            Select-Object Name |
            Format-Table -AutoSize

      - name: Locate WDK headers and x86 kernel library
        shell: powershell
        run: |
          $packages = "$env:GITHUB_WORKSPACE\packages"

          $ntddk = Get-ChildItem $packages `
            -Recurse `
            -File `
            -Filter "ntddk.h" |
            Select-Object -First 1

          $ntdef = Get-ChildItem $packages `
            -Recurse `
            -File `
            -Filter "ntdef.h" |
            Select-Object -First 1

          $ntoskrnl = Get-ChildItem $packages `
            -Recurse `
            -File `
            -Filter "ntoskrnl.lib" |
            Where-Object {
              $_.FullName -match "\\x86\\" -or
              $_.FullName -match "\\i386\\"
            } |
            Select-Object -First 1

          if (-not $ntddk) {
            throw "ntddk.h not found"
          }

          if (-not $ntdef) {
            throw "ntdef.h not found"
          }

          if (-not $ntoskrnl) {
            throw "x86 ntoskrnl.lib not found"
          }

          $kmInclude = Split-Path $ntddk.FullName
          $sharedInclude = Split-Path $ntdef.FullName
          $kmLib = Split-Path $ntoskrnl.FullName

          Write-Host "=== NTDDK ==="
          Write-Host $ntddk.FullName

          Write-Host ""
          Write-Host "=== KM INCLUDE ==="
          Write-Host $kmInclude

          Write-Host ""
          Write-Host "=== SHARED INCLUDE ==="
          Write-Host $sharedInclude

          Write-Host ""
          Write-Host "=== NTOSKRNL X86 ==="
          Write-Host $ntoskrnl.FullName

          "KM_INCLUDE=$kmInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SHARED_INCLUDE=$sharedInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KM_LIB=$kmLib" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate x86 MSVC compiler
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual C++ installation not found"
          }

          $vcvars = Join-Path `
            $vs `
            "VC\Auxiliary\Build\vcvars32.bat"

          if (-not (Test-Path $vcvars)) {
            throw "vcvars32.bat not found"
          }

          Write-Host "=== VCVARS32 ==="
          Write-Host $vcvars

          "VCVARS32=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create read-only Dell SMM driver
        shell: powershell
        run: |
          $source = @'
          #include <ntddk.h>

          #define DEVICE_NAME L"\Device\DellSmmReadOnly"
          #define DOS_NAME    L"\DosDevices\DellSmmReadOnly"

          #define IOCTL_DELL_GET_FAN0_RPM \
              CTL_CODE(FILE_DEVICE_UNKNOWN, 0x800, METHOD_BUFFERED, FILE_READ_DATA)

          typedef struct _DELL_RPM_RESULT {
              ULONG RawEax;
              ULONG RawCount;
              ULONG Rpm;
              ULONG CarryFlag;
          } DELL_RPM_RESULT, *PDELL_RPM_RESULT;

          DRIVER_INITIALIZE DriverEntry;
          DRIVER_UNLOAD DellUnload;
          DRIVER_DISPATCH DellCreateClose;
          DRIVER_DISPATCH DellUnsupported;
          DRIVER_DISPATCH DellDeviceControl;

          static NTSTATUS
          CompleteIrp(
              PIRP Irp,
              NTSTATUS Status,
              ULONG_PTR Information
              )
          {
              Irp->IoStatus.Status = Status;
              Irp->IoStatus.Information = Information;
              IoCompleteRequest(Irp, IO_NO_INCREMENT);
              return Status;
          }

          /*
           * READ ONLY.
           *
           * Dell legacy SMM:
           * EAX = 0x02A3 = read fan speed
           * EBX = 0      = fan 0
           *
           * This version contains NO command for changing
           * fan speed and NO command for disabling BIOS
           * automatic fan control.
           */
          static ULONG
          DellReadFan0(
              PUCHAR CarryFlag
              )
          {
              ULONG resultEax = 0xFFFFFFFF;
              UCHAR carry = 0xFF;
              KAFFINITY oldAffinity;

              oldAffinity =
                  KeSetSystemAffinityThreadEx((KAFFINITY)1);

              if (KeGetCurrentProcessorNumber() != 0) {
                  KeRevertToUserAffinityThreadEx(oldAffinity);
                  *CarryFlag = 0xFE;
                  return 0xFFFFFFFF;
              }

              __asm {
                  push ebx
                  push esi
                  push edi

                  mov eax, 02A3h
                  xor ebx, ebx
                  xor ecx, ecx
                  xor edx, edx
                  xor esi, esi
                  xor edi, edi

                  out 0B2h, al
                  out 084h, al

                  setc carry
                  mov resultEax, eax

                  pop edi
                  pop esi
                  pop ebx
              }

              KeRevertToUserAffinityThreadEx(oldAffinity);

              *CarryFlag = carry;
              return resultEax;
          }

          NTSTATUS NTAPI
          DellCreateClose(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              UNREFERENCED_PARAMETER(DeviceObject);

              return CompleteIrp(
                  Irp,
                  STATUS_SUCCESS,
                  0
                  );
          }

          NTSTATUS NTAPI
          DellUnsupported(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              UNREFERENCED_PARAMETER(DeviceObject);

              return CompleteIrp(
                  Irp,
                  STATUS_INVALID_DEVICE_REQUEST,
                  0
                  );
          }

          NTSTATUS NTAPI
          DellDeviceControl(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              PIO_STACK_LOCATION stack;
              ULONG code;

              UNREFERENCED_PARAMETER(DeviceObject);

              stack =
                  IoGetCurrentIrpStackLocation(Irp);

              code =
                  stack->Parameters.DeviceIoControl.IoControlCode;

              if (code == IOCTL_DELL_GET_FAN0_RPM) {

                  PDELL_RPM_RESULT result;
                  ULONG raw;
                  ULONG count;
                  UCHAR carry = 0;

                  if (
                      stack->Parameters.DeviceIoControl.OutputBufferLength
                      < sizeof(DELL_RPM_RESULT)
                     ) {
                      return CompleteIrp(
                          Irp,
                          STATUS_BUFFER_TOO_SMALL,
                          0
                          );
                  }

                  result =
                      (PDELL_RPM_RESULT)
                      Irp->AssociatedIrp.SystemBuffer;

                  raw = DellReadFan0(&carry);
                  count = raw & 0xFFFF;

                  result->RawEax = raw;
                  result->RawCount = count;
                  result->Rpm = count * 30;
                  result->CarryFlag = carry;

                  if (
                      carry != 0 ||
                      count == 0xFFFF ||
                      raw == 0x000002A3
                     ) {
                      return CompleteIrp(
                          Irp,
                          STATUS_DEVICE_DATA_ERROR,
                          sizeof(DELL_RPM_RESULT)
                          );
                  }

                  return CompleteIrp(
                      Irp,
                      STATUS_SUCCESS,
                      sizeof(DELL_RPM_RESULT)
                      );
              }

              return CompleteIrp(
                  Irp,
                  STATUS_INVALID_DEVICE_REQUEST,
                  0
                  );
          }

          VOID NTAPI
          DellUnload(
              PDRIVER_OBJECT DriverObject
              )
          {
              UNICODE_STRING dosName;

              RtlInitUnicodeString(
                  &dosName,
                  DOS_NAME
                  );

              IoDeleteSymbolicLink(&dosName);

              if (DriverObject->DeviceObject != NULL) {
                  IoDeleteDevice(
                      DriverObject->DeviceObject
                      );
              }
          }

          NTSTATUS NTAPI
          DriverEntry(
              PDRIVER_OBJECT DriverObject,
              PUNICODE_STRING RegistryPath
              )
          {
              UNICODE_STRING deviceName;
              UNICODE_STRING dosName;
              PDEVICE_OBJECT deviceObject = NULL;
              NTSTATUS status;
              ULONG i;

              UNREFERENCED_PARAMETER(RegistryPath);

              for (
                  i = 0;
                  i <= IRP_MJ_MAXIMUM_FUNCTION;
                  ++i
                  ) {
                  DriverObject->MajorFunction[i] =
                      DellUnsupported;
              }

              DriverObject->MajorFunction[IRP_MJ_CREATE] =
                  DellCreateClose;

              DriverObject->MajorFunction[IRP_MJ_CLOSE] =
                  DellCreateClose;

              DriverObject->MajorFunction[IRP_MJ_DEVICE_CONTROL] =
                  DellDeviceControl;

              DriverObject->DriverUnload =
                  DellUnload;

              RtlInitUnicodeString(
                  &deviceName,
                  DEVICE_NAME
                  );

              status = IoCreateDevice(
                  DriverObject,
                  0,
                  &deviceName,
                  FILE_DEVICE_UNKNOWN,
                  FILE_DEVICE_SECURE_OPEN,
                  FALSE,
                  &deviceObject
                  );

              if (!NT_SUCCESS(status)) {
                  return status;
              }

              deviceObject->Flags |= DO_BUFFERED_IO;

              RtlInitUnicodeString(
                  &dosName,
                  DOS_NAME
                  );

              status = IoCreateSymbolicLink(
                  &dosName,
                  &deviceName
                  );

              if (!NT_SUCCESS(status)) {
                  IoDeleteDevice(deviceObject);
                  return status;
              }

              deviceObject->Flags &=
                  ~DO_DEVICE_INITIALIZING;

              return STATUS_SUCCESS;
          }
          '@

          $file =
              "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c"

          Set-Content `
            -Path $file `
            -Value $source `
            -Encoding ASCII

          Write-Host "=== SOURCE ==="

          Get-Item $file |
            Select-Object Name,Length

      - name: Compile and link x86 SYS directly
        shell: powershell
        run: |
          $batch =
              "$env:GITHUB_WORKSPACE\build-driver.cmd"

          $content = @"
          @echo off
          setlocal

          call "$env:VCVARS32"
          if errorlevel 1 exit /b 10

          echo.
          echo ===== CL =====
          where cl.exe

          echo.
          echo ===== LINK =====
          where link.exe

          echo.
          echo ===== COMPILE =====

          cl.exe ^
            /nologo ^
            /c ^
            /TC ^
            /kernel ^
            /GS- ^
            /Gz ^
            /Zl ^
            /W3 ^
            /D_X86_=1 ^
            /DWIN32=1 ^
            /D_WIN32_WINNT=0x0601 ^
            /DNTDDI_VERSION=0x06010000 ^
            /I"$env:KM_INCLUDE" ^
            /I"$env:SHARED_INCLUDE" ^
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c" ^
            /Fo"$env:GITHUB_WORKSPACE\DellSmmReadOnly.obj"

          if errorlevel 1 exit /b 20

          echo.
          echo ===== LINK DRIVER =====

          link.exe ^
            /nologo ^
            /DRIVER:WDM ^
            /SUBSYSTEM:NATIVE ^
            /MACHINE:X86 ^
            /ENTRY:DriverEntry ^
            /NODEFAULTLIB ^
            /INCREMENTAL:NO ^
            /KERNEL ^
            /OUT:"$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys" ^
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.obj" ^
            /LIBPATH:"$env:KM_LIB" ^
            ntoskrnl.lib

          if errorlevel 1 exit /b 30

          exit /b 0
          "@

          Set-Content `
            -Path $batch `
            -Value $content `
            -Encoding ASCII

          Write-Host "=== BUILD SCRIPT ==="
          Get-Content $batch

          & cmd.exe /d /c $batch

          $code = $LASTEXITCODE

          Write-Host ""
          Write-Host "BUILD EXIT CODE = $code"

          if ($code -ne 0) {
              throw "Direct x86 build failed"
          }

      - name: Verify generated driver
        shell: powershell
        run: |
          $sys =
              "$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys"

          if (-not (Test-Path $sys)) {
              throw "DellSmmReadOnly.sys not generated"
          }

          $bytes =
              [System.IO.File]::ReadAllBytes($sys)

          $peOffset =
              [BitConverter]::ToInt32(
                  $bytes,
                  0x3C
              )

          $machine =
              [BitConverter]::ToUInt16(
                  $bytes,
                  $peOffset + 4
              )

          Write-Host "=== DRIVER FILE ==="

          Get-Item $sys |
            Select-Object Name,Length

          Write-Host ""
          Write-Host (
              "PE MACHINE = 0x{0:X4}" -f $machine
          )

          if ($machine -ne 0x014C) {
              throw "Generated driver is not x86"
          }

          Write-Host ""
          Write-Host "ARCHITECTURE = x86 / i386 -- CORRECT"

          $hash =
              Get-FileHash `
                  $sys `
                  -Algorithm SHA256

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host $hash.Hash

          $artifact =
              "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force |
            Out-Null

          Copy-Item `
            $sys `
            "$artifact\DellSmmReadOnly.sys"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c" `
            "$artifact\DellSmmReadOnly.c"

          @"
          Dell Studio 1558 experimental SMM driver
          ----------------------------------------
          Architecture: x86
          Mode: READ ONLY

          Implemented SMM command:
          0x02A3 = Read fan RPM

          Fan speed control: NOT IMPLEMENTED
          BIOS automatic fan control changes: NOT IMPLEMENTED

          SHA256:
          $($hash.Hash)
          "@ |
            Set-Content `
              "$artifact\BUILD-INFO.txt" `
              -Encoding ASCII

      - name: Upload x86 read-only driver
        uses: actions/upload-artifact@v4
        with:
          name: DellSmmReadOnly-x86
          path: artifact
          if-no-files-found: error
