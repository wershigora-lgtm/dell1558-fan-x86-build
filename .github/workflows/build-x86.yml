name: Build Dell SMM read-only x86 driver

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Download official Microsoft SDK and WDK 22621
        shell: powershell
        run: |
          $sdk = "$env:RUNNER_TEMP\winsdksetup.exe"
          $wdk = "$env:RUNNER_TEMP\wdksetup.exe"

          Write-Host "Downloading Windows SDK..."
          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/cb9de490-6e67-4ac6-8c2c-6dfabb824e8a/windowssdk/winsdksetup.exe" `
            -o $sdk

          if ($LASTEXITCODE -ne 0) {
            throw "SDK download failed"
          }

          Write-Host "Downloading Windows WDK..."
          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/03f059f8-d6a3-4b9c-b85b-95cc401be222/wdk/wdksetup.exe" `
            -o $wdk

          if ($LASTEXITCODE -ne 0) {
            throw "WDK download failed"
          }

      - name: Install Windows SDK
        shell: powershell
        run: |
          $exe = "$env:RUNNER_TEMP\winsdksetup.exe"

          $p = Start-Process `
            $exe `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "SDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "SDK installation failed"
          }

      - name: Install Windows WDK
        shell: powershell
        run: |
          $exe = "$env:RUNNER_TEMP\wdksetup.exe"

          $p = Start-Process `
            $exe `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "WDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "WDK installation failed"
          }

      - name: Locate x86 kernel headers and library
        shell: powershell
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"

          $ntddk = Get-ChildItem `
            "$kits\Include" `
            -Recurse `
            -File `
            -Filter "ntddk.h" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\km\\ntddk\.h$"
            } |
            Select-Object -First 1

          $ntdef = Get-ChildItem `
            "$kits\Include" `
            -Recurse `
            -File `
            -Filter "ntdef.h" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\shared\\ntdef\.h$"
            } |
            Select-Object -First 1

          $ntoskrnl = Get-ChildItem `
            "$kits\Lib" `
            -Recurse `
            -File `
            -Filter "ntoskrnl.lib" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\km\\x86\\ntoskrnl\.lib$"
            } |
            Select-Object -First 1

          if (-not $ntddk) {
            throw "ntddk.h 22621 not found"
          }

          if (-not $ntdef) {
            throw "ntdef.h 22621 not found"
          }

          if (-not $ntoskrnl) {
            throw "x86 ntoskrnl.lib 22621 not found"
          }

          $kmInclude = Split-Path $ntddk.FullName
          $sharedInclude = Split-Path $ntdef.FullName
          $kmLib = Split-Path $ntoskrnl.FullName

          Write-Host "NTDDK: $($ntddk.FullName)"
          Write-Host "SHARED: $sharedInclude"
          Write-Host "NTOSKRNL X86: $($ntoskrnl.FullName)"

          "KM_INCLUDE=$kmInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SHARED_INCLUDE=$sharedInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KM_LIB=$kmLib" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate Visual C++ x86 compiler
        shell: powershell
        run: |
          $vswhere =
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual C++ tools not found"
          }

          $vcvars =
            Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"

          if (-not (Test-Path $vcvars)) {
            throw "vcvars32.bat not found"
          }

          Write-Host "VCVARS32: $vcvars"

          "VCVARS32=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Dell SMM read-only driver source
        shell: powershell
        run: |
          $source = @'
          #include <ntddk.h>
          
        #define DEVICE_NAME L"\\Device\\DellSmmReadOnly"
          #define DOS_NAME    L"\\DosDevices\\DellSmmReadOnly"

          #define IOCTL_DELL_READ_FAN0 \
              CTL_CODE(FILE_DEVICE_UNKNOWN, 0x800, METHOD_BUFFERED, FILE_READ_ACCESS)

          typedef struct _DELL_SMM_RESULT
          {
              ULONG RawEax;
              ULONG RawEbx;
              ULONG RawEcx;
              ULONG RawEdx;
              ULONG RawEsi;
              ULONG RawEdi;
              ULONG Rpm;
              ULONG CarryFlag;
              ULONG CpuNumber;
              ULONG Valid;
          } DELL_SMM_RESULT, *PDELL_SMM_RESULT;

          DRIVER_INITIALIZE DriverEntry;
          DRIVER_UNLOAD DellUnload;
          DRIVER_DISPATCH DellCreateClose;
          DRIVER_DISPATCH DellUnsupported;
          DRIVER_DISPATCH DellDeviceControl;

          static NTSTATUS
          CompleteIrp(
              PIRP Irp,
              NTSTATUS Status,
              ULONG_PTR Information
              )
          {
              Irp->IoStatus.Status = Status;
              Irp->IoStatus.Information = Information;
              IoCompleteRequest(Irp, IO_NO_INCREMENT);
              return Status;
          }

          /*
           * READ-ONLY Dell legacy SMM operation.
           *
           * EAX = 0x02A3 : request fan speed
           * EBX = 0      : fan 0
           *
           * This function contains NO command for setting fan speed,
           * disabling BIOS fan control, or writing an RPM value.
           *
           * It is NOT called from DriverEntry.
           * It runs only after an explicit DeviceIoControl request.
           */
          static VOID
          DellReadFan0(
              PDELL_SMM_RESULT Result
              )
          {
              ULONG eaxValue = 0x000002A3;
              ULONG ebxValue = 0;
              ULONG ecxValue = 0;
              ULONG edxValue = 0;
              ULONG esiValue = 0;
              ULONG ediValue = 0;

              UCHAR carry = 0xFF;
              KAFFINITY oldAffinity;

              Result->RawEax = 0;
              Result->RawEbx = 0;
              Result->RawEcx = 0;
              Result->RawEdx = 0;
              Result->RawEsi = 0;
              Result->RawEdi = 0;
              Result->Rpm = 0;
              Result->CarryFlag = 0xFFFFFFFF;
              Result->CpuNumber = 0xFFFFFFFF;
              Result->Valid = 0;

              /*
               * Run the legacy Dell SMM call on CPU 0.
               */
              oldAffinity =
                  KeSetSystemAffinityThreadEx((KAFFINITY)1);

              Result->CpuNumber =
                  KeGetCurrentProcessorNumber();

              if (Result->CpuNumber != 0)
              {
                  KeRevertToUserAffinityThreadEx(oldAffinity);
                  Result->CarryFlag = 0xFE;
                  return;
              }

              __asm
              {
                  push ebx
                  push esi
                  push edi

                  mov eax, eaxValue
                  mov ebx, ebxValue
                  mov ecx, ecxValue
                  mov edx, edxValue
                  mov esi, esiValue
                  mov edi, ediValue

                  out 0B2h, al
                  out 084h, al

                  setc carry

                  mov eaxValue, eax
                  mov ebxValue, ebx
                  mov ecxValue, ecx
                  mov edxValue, edx
                  mov esiValue, esi
                  mov ediValue, edi

                  pop edi
                  pop esi
                  pop ebx
              }

              KeRevertToUserAffinityThreadEx(oldAffinity);

              Result->RawEax = eaxValue;
              Result->RawEbx = ebxValue;
              Result->RawEcx = ecxValue;
              Result->RawEdx = edxValue;
              Result->RawEsi = esiValue;
              Result->RawEdi = ediValue;

              Result->Rpm =
                  eaxValue & 0xFFFF;

              Result->CarryFlag =
                  (ULONG)carry;

              /*
               * Diagnostic validity test only.
               * We still return all raw registers to user mode.
               */
              if (
                  carry == 0 &&
                  (eaxValue & 0xFFFF) != 0xFFFF &&
                  eaxValue != 0x000002A3
                 )
              {
                  Result->Valid = 1;
              }
          }

          NTSTATUS
          DellCreateClose(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              UNREFERENCED_PARAMETER(DeviceObject);

              return CompleteIrp(
                  Irp,
                  STATUS_SUCCESS,
                  0
                  );
          }

          NTSTATUS
          DellUnsupported(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              UNREFERENCED_PARAMETER(DeviceObject);

              return CompleteIrp(
                  Irp,
                  STATUS_INVALID_DEVICE_REQUEST,
                  0
                  );
          }

          NTSTATUS
          DellDeviceControl(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              PIO_STACK_LOCATION stack;
              ULONG code;

              UNREFERENCED_PARAMETER(DeviceObject);

              stack =
                  IoGetCurrentIrpStackLocation(Irp);

              code =
                  stack->Parameters.DeviceIoControl.IoControlCode;

              if (code == IOCTL_DELL_READ_FAN0)
              {
                  PDELL_SMM_RESULT result;

                  if (
                      stack->Parameters.DeviceIoControl.OutputBufferLength
                      < sizeof(DELL_SMM_RESULT)
                     )
                  {
                      return CompleteIrp(
                          Irp,
                          STATUS_BUFFER_TOO_SMALL,
                          0
                          );
                  }

                  result =
                      (PDELL_SMM_RESULT)
                      Irp->AssociatedIrp.SystemBuffer;

                  DellReadFan0(result);

                  return CompleteIrp(
                      Irp,
                      STATUS_SUCCESS,
                      sizeof(DELL_SMM_RESULT)
                      );
              }

              return CompleteIrp(
                  Irp,
                  STATUS_INVALID_DEVICE_REQUEST,
                  0
                  );
          }

          VOID
          DellUnload(
              PDRIVER_OBJECT DriverObject
              )
          {
              UNICODE_STRING dosName;

              RtlInitUnicodeString(
                  &dosName,
                  DOS_NAME
                  );

              IoDeleteSymbolicLink(
                  &dosName
                  );

              if (DriverObject->DeviceObject != NULL)
              {
                  IoDeleteDevice(
                      DriverObject->DeviceObject
                      );
              }
          }

          NTSTATUS
          DriverEntry(
              PDRIVER_OBJECT DriverObject,
              PUNICODE_STRING RegistryPath
              )
          {
              UNICODE_STRING deviceName;
              UNICODE_STRING dosName;
              PDEVICE_OBJECT deviceObject = NULL;
              NTSTATUS status;
              ULONG i;

              UNREFERENCED_PARAMETER(RegistryPath);

              for (
                  i = 0;
                  i <= IRP_MJ_MAXIMUM_FUNCTION;
                  ++i
                  )
              {
                  DriverObject->MajorFunction[i] =
                      DellUnsupported;
              }

              DriverObject->MajorFunction[IRP_MJ_CREATE] =
                  DellCreateClose;

              DriverObject->MajorFunction[IRP_MJ_CLOSE] =
                  DellCreateClose;

              DriverObject->MajorFunction[IRP_MJ_DEVICE_CONTROL] =
                  DellDeviceControl;

              DriverObject->DriverUnload =
                  DellUnload;

              RtlInitUnicodeString(
                  &deviceName,
                  DEVICE_NAME
                  );

              status =
                  IoCreateDevice(
                      DriverObject,
                      0,
                      &deviceName,
                      FILE_DEVICE_UNKNOWN,
                      FILE_DEVICE_SECURE_OPEN,
                      FALSE,
                      &deviceObject
                      );

              if (!NT_SUCCESS(status))
              {
                  return status;
              }

              deviceObject->Flags |= DO_BUFFERED_IO;

              RtlInitUnicodeString(
                  &dosName,
                  DOS_NAME
                  );

              status =
                  IoCreateSymbolicLink(
                      &dosName,
                      &deviceName
                      );

              if (!NT_SUCCESS(status))
              {
                  IoDeleteDevice(deviceObject);
                  return status;
              }

              deviceObject->Flags &=
                  ~DO_DEVICE_INITIALIZING;

              return STATUS_SUCCESS;
          }
          '@

          $file =
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c"

          Set-Content `
            -Path $file `
            -Value $source `
            -Encoding ASCII

          Write-Host "=== SOURCE CREATED ==="

          Get-Item $file |
            Select-Object Name,Length

      - name: Compile Dell SMM driver to OBJ
        shell: powershell
        run: |
          $batch =
            "$env:GITHUB_WORKSPACE\compile.cmd"

          $content = @"
          @echo off
          setlocal

          call "$env:VCVARS32"

          if errorlevel 1 exit /b 10

          echo.
          echo ===== COMPILER =====
          where cl.exe

          echo.
          echo ===== COMPILE =====

          cl.exe ^
            /nologo ^
            /c ^
            /TC ^
            /Gz ^
            /kernel ^
            /GS- ^
            /Zl ^
            /W3 ^
            /D_X86_=1 ^
            /DWIN32=1 ^
            /D_WIN32_WINNT=0x0601 ^
            /DNTDDI_VERSION=0x06010000 ^
            /I"$env:KM_INCLUDE" ^
            /I"$env:SHARED_INCLUDE" ^
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c" ^
            /Fo:"$env:GITHUB_WORKSPACE\DellSmmReadOnly.obj"

          if errorlevel 1 exit /b 20

          echo.
          echo ===== DRIVERENTRY SYMBOL =====

          dumpbin.exe /symbols ^
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.obj" ^
            | findstr /i DriverEntry

          dumpbin.exe /symbols ^
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.obj" ^
            | findstr /C:"_DriverEntry@8"

          if errorlevel 1 exit /b 21

          echo.
          echo CORRECT X86 STDCALL DRIVERENTRY FOUND

          exit /b 0
          "@

          Set-Content `
            -Path $batch `
            -Value $content `
            -Encoding ASCII

          & cmd.exe /d /c $batch

          $code = $LASTEXITCODE

          Write-Host ""
          Write-Host "COMPILE EXIT CODE = $code"

          if ($code -ne 0) {
            throw "Dell SMM x86 compilation failed"
          }

      - name: Link Dell SMM OBJ to SYS
        shell: powershell
        run: |
          $batch =
            "$env:GITHUB_WORKSPACE\link.cmd"

          $content = @"
          @echo off
          setlocal

          call "$env:VCVARS32"

          if errorlevel 1 exit /b 10

          echo.
          echo ===== LINK DRIVER =====

          link.exe ^
            /nologo ^
            /DRIVER:WDM ^
            /SUBSYSTEM:NATIVE ^
            /MACHINE:X86 ^
            /ENTRY:DriverEntry@8 ^
            /NODEFAULTLIB ^
            /INCREMENTAL:NO ^
            /OUT:"$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys" ^
            /LIBPATH:"$env:KM_LIB" ^
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.obj" ^
            ntoskrnl.lib

          if errorlevel 1 exit /b 20

          echo.
          echo ===== SYS CREATED =====
          dir "$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys"

          exit /b 0
          "@

          Set-Content `
            -Path $batch `
            -Value $content `
            -Encoding ASCII

          & cmd.exe /d /c $batch

          $code = $LASTEXITCODE

          Write-Host ""
          Write-Host "LINK EXIT CODE = $code"

          if ($code -ne 0) {
            throw "Dell SMM x86 link failed"
          }

      - name: Verify generated driver
        shell: powershell
        run: |
          $sys =
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys"

          if (-not (Test-Path $sys)) {
            throw "DellSmmReadOnly.sys does not exist"
          }

          $bytes =
            [System.IO.File]::ReadAllBytes($sys)

          if ($bytes.Length -lt 256) {
            throw "SYS file is unexpectedly small"
          }

          $peOffset =
            [BitConverter]::ToInt32(
              $bytes,
              0x3C
            )

          $machine =
            [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )

          Write-Host ""
          Write-Host "===== RESULT ====="

          Get-Item $sys |
            Select-Object Name,Length

          Write-Host ""
          Write-Host (
            "PE MACHINE = 0x{0:X4}" -f $machine
          )

          if ($machine -ne 0x014C) {
            throw "Generated driver is NOT x86/i386"
          }

          Write-Host "ARCHITECTURE = x86 / i386"

          $hash =
            Get-FileHash `
              $sys `
              -Algorithm SHA256

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host $hash.Hash

          $artifact =
            "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force |
            Out-Null

          Copy-Item `
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys" `
            "$artifact\DellSmmReadOnly.sys"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.obj" `
            "$artifact\DellSmmReadOnly.obj"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c" `
            "$artifact\DellSmmReadOnly.c"

          @"
          Dell Studio 1558 experimental Dell SMM driver
          ===============================================

          Architecture:
          x86 / i386

          Calling convention:
          __stdcall (/Gz)

          Entry point:
          DriverEntry@8

          Implemented SMM operation:
          READ fan 0 only

          Requested Dell legacy function:
          EAX = 0x02A3
          EBX = 0

          Fan speed SET command:
          NOT IMPLEMENTED

          BIOS fan-control disable command:
          NOT IMPLEMENTED

          SMM is NOT called during DriverEntry.
          Hardware access occurs only after an explicit IOCTL.

          SHA256:
          $($hash.Hash)
          "@ |
            Set-Content `
              "$artifact\BUILD-INFO.txt" `
              -Encoding ASCII

      - name: Upload Dell SMM read-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: DellSmmReadOnly-x86
          path: artifact
          if-no-files-found: error
