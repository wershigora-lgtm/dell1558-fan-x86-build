name: Test minimal x86 kernel driver

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Download official Microsoft SDK and WDK 22621
        shell: powershell
        run: |
          $sdk = "$env:RUNNER_TEMP\winsdksetup.exe"
          $wdk = "$env:RUNNER_TEMP\wdksetup.exe"

          Write-Host "Downloading Windows SDK..."
          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/cb9de490-6e67-4ac6-8c2c-6dfabb824e8a/windowssdk/winsdksetup.exe" `
            -o $sdk

          if ($LASTEXITCODE -ne 0) {
            throw "SDK download failed"
          }

          Write-Host "Downloading Windows WDK..."
          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/03f059f8-d6a3-4b9c-b85b-95cc401be222/wdk/wdksetup.exe" `
            -o $wdk

          if ($LASTEXITCODE -ne 0) {
            throw "WDK download failed"
          }

          Get-Item $sdk,$wdk |
            Select-Object Name,Length

      - name: Install Windows SDK
        shell: powershell
        run: |
          $exe = "$env:RUNNER_TEMP\winsdksetup.exe"

          $p = Start-Process `
            $exe `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "SDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "SDK installation failed"
          }

      - name: Install Windows WDK
        shell: powershell
        run: |
          $exe = "$env:RUNNER_TEMP\wdksetup.exe"

          $p = Start-Process `
            $exe `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "WDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "WDK installation failed"
          }

      - name: Locate x86 kernel headers and library
        shell: powershell
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"

          $ntddk = Get-ChildItem `
            "$kits\Include" `
            -Recurse `
            -File `
            -Filter "ntddk.h" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\km\\ntddk\.h$"
            } |
            Select-Object -First 1

          $ntdef = Get-ChildItem `
            "$kits\Include" `
            -Recurse `
            -File `
            -Filter "ntdef.h" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\shared\\ntdef\.h$"
            } |
            Select-Object -First 1

          $ntoskrnl = Get-ChildItem `
            "$kits\Lib" `
            -Recurse `
            -File `
            -Filter "ntoskrnl.lib" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\km\\x86\\ntoskrnl\.lib$"
            } |
            Select-Object -First 1

          if (-not $ntddk) {
            throw "ntddk.h 22621 not found"
          }

          if (-not $ntdef) {
            throw "ntdef.h 22621 not found"
          }

          if (-not $ntoskrnl) {
            throw "x86 ntoskrnl.lib 22621 not found"
          }

          $kmInclude = Split-Path $ntddk.FullName
          $sharedInclude = Split-Path $ntdef.FullName
          $kmLib = Split-Path $ntoskrnl.FullName

          Write-Host "=== NTDDK ==="
          Write-Host $ntddk.FullName

          Write-Host ""
          Write-Host "=== SHARED INCLUDE ==="
          Write-Host $sharedInclude

          Write-Host ""
          Write-Host "=== X86 NTOSKRNL ==="
          Write-Host $ntoskrnl.FullName

          "KM_INCLUDE=$kmInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SHARED_INCLUDE=$sharedInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KM_LIB=$kmLib" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate Visual C++ x86 compiler
        shell: powershell
        run: |
          $vswhere =
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual C++ tools not found"
          }

          $vcvars =
            Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"

          if (-not (Test-Path $vcvars)) {
            throw "vcvars32.bat not found"
          }

          Write-Host "=== VCVARS32 ==="
          Write-Host $vcvars

          "VCVARS32=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create absolutely minimal x86 driver source
        shell: powershell
        run: |
          $source = @'
          #include <ntddk.h>

          DRIVER_INITIALIZE DriverEntry;

          _Use_decl_annotations_
          NTSTATUS
          DriverEntry(
              PDRIVER_OBJECT DriverObject,
              PUNICODE_STRING RegistryPath
              )
          {
              UNREFERENCED_PARAMETER(DriverObject);
              UNREFERENCED_PARAMETER(RegistryPath);

              return STATUS_SUCCESS;
          }
          '@

          $file =
            "$env:GITHUB_WORKSPACE\MinimalX86.c"

          Set-Content `
            -Path $file `
            -Value $source `
            -Encoding ASCII

          Write-Host "=== MINIMAL SOURCE ==="
          Get-Content $file

      - name: Compile minimal driver to OBJ
        shell: powershell
        run: |
          $batch =
            "$env:GITHUB_WORKSPACE\compile.cmd"

          $content = @"
          @echo off
          setlocal

          call "$env:VCVARS32"

          if errorlevel 1 exit /b 10

          echo.
          echo ===== COMPILER =====
          where cl.exe

          echo.
          echo ===== COMPILE ONLY =====

          cl.exe ^
            /nologo ^
            /c ^
            /TC ^
            /Gz ^
            /kernel ^
            /GS- ^
            /Zl ^
            /W3 ^
            /D_X86_=1 ^
            /DWIN32=1 ^
            /D_WIN32_WINNT=0x0601 ^
            /DNTDDI_VERSION=0x06010000 ^
            /I"$env:KM_INCLUDE" ^
            /I"$env:SHARED_INCLUDE" ^
            "$env:GITHUB_WORKSPACE\MinimalX86.c" ^
            /Fo:"$env:GITHUB_WORKSPACE\MinimalX86.obj"

          if errorlevel 1 exit /b 20

          echo.
          echo ===== OBJECT CREATED =====
          dir "$env:GITHUB_WORKSPACE\MinimalX86.obj"

          echo.
          echo ===== DRIVERENTRY SYMBOL =====
          dumpbin.exe /symbols "$env:GITHUB_WORKSPACE\MinimalX86.obj" | findstr /i DriverEntry

          exit /b 0
          "@

          Set-Content `
            -Path $batch `
            -Value $content `
            -Encoding ASCII

          Get-Content $batch

          & cmd.exe /d /c $batch

          $code = $LASTEXITCODE

          Write-Host ""
          Write-Host "COMPILE EXIT CODE = $code"

          if ($code -ne 0) {
            throw "Minimal x86 C compilation failed"
          }

      - name: Link minimal OBJ to SYS
        shell: powershell
        run: |
          $batch =
            "$env:GITHUB_WORKSPACE\link.cmd"

          $content = @"
          @echo off
          setlocal

          call "$env:VCVARS32"

          if errorlevel 1 exit /b 10

          echo.
          echo ===== LINKER =====
          where link.exe

          echo.
          echo ===== LINK DRIVER =====

          link.exe ^
            /nologo ^
            /DRIVER:WDM ^
            /SUBSYSTEM:NATIVE ^
            /MACHINE:X86 ^
            /ENTRY:DriverEntry@8 ^
            /NODEFAULTLIB ^
            /INCREMENTAL:NO ^
            /OUT:"$env:GITHUB_WORKSPACE\MinimalX86.sys" ^
            /LIBPATH:"$env:KM_LIB" ^
            "$env:GITHUB_WORKSPACE\MinimalX86.obj" ^
            ntoskrnl.lib

          if errorlevel 1 exit /b 20

          echo.
          echo ===== SYS CREATED =====
          dir "$env:GITHUB_WORKSPACE\MinimalX86.sys"

          exit /b 0
          "@

          Set-Content `
            -Path $batch `
            -Value $content `
            -Encoding ASCII

          Get-Content $batch

          & cmd.exe /d /c $batch

          $code = $LASTEXITCODE

          Write-Host ""
          Write-Host "LINK EXIT CODE = $code"

          if ($code -ne 0) {
            throw "Minimal x86 driver link failed"
          }

      - name: Verify generated SYS is really x86
        shell: powershell
        run: |
          $sys =
            "$env:GITHUB_WORKSPACE\MinimalX86.sys"

          if (-not (Test-Path $sys)) {
            throw "MinimalX86.sys does not exist"
          }

          $bytes =
            [System.IO.File]::ReadAllBytes($sys)

          if ($bytes.Length -lt 256) {
            throw "SYS file is unexpectedly small"
          }

          $peOffset =
            [BitConverter]::ToInt32(
              $bytes,
              0x3C
            )

          $machine =
            [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )

          Write-Host ""
          Write-Host "===== RESULT ====="

          Get-Item $sys |
            Select-Object Name,Length

          Write-Host ""
          Write-Host (
            "PE MACHINE = 0x{0:X4}" -f $machine
          )

          if ($machine -ne 0x014C) {
            throw "Generated driver is NOT x86/i386"
          }

          Write-Host ""
          Write-Host "SUCCESS: MINIMAL X86 DRIVER WAS BUILT"

          $hash =
            Get-FileHash `
              $sys `
              -Algorithm SHA256

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host $hash.Hash

          $artifact =
            "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force |
            Out-Null

          Copy-Item `
            "$env:GITHUB_WORKSPACE\MinimalX86.sys" `
            "$artifact\MinimalX86.sys"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\MinimalX86.obj" `
            "$artifact\MinimalX86.obj"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\MinimalX86.c" `
            "$artifact\MinimalX86.c"

      - name: Upload minimal x86 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalX86-driver-test
          path: artifact
          if-no-files-found: error
