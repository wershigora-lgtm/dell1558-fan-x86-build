name: Build Dell Studio 1558 x86 RPM driver direct

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Download official Microsoft SDK and WDK 22621
        shell: powershell
        run: |
          $sdk = "$env:RUNNER_TEMP\winsdksetup.exe"
          $wdk = "$env:RUNNER_TEMP\wdksetup.exe"

          Write-Host "Downloading Windows SDK..."
          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/cb9de490-6e67-4ac6-8c2c-6dfabb824e8a/windowssdk/winsdksetup.exe" `
            -o $sdk

          if ($LASTEXITCODE -ne 0) {
            throw "SDK download failed"
          }

          Write-Host "Downloading Windows WDK..."
          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/03f059f8-d6a3-4b9c-b85b-95cc401be222/wdk/wdksetup.exe" `
            -o $wdk

          if ($LASTEXITCODE -ne 0) {
            throw "WDK download failed"
          }

          Get-Item $sdk,$wdk |
            Select-Object Name,Length

      - name: Install Windows SDK
        shell: powershell
        run: |
          $exe = "$env:RUNNER_TEMP\winsdksetup.exe"

          $p = Start-Process `
            $exe `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "SDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "SDK installation failed"
          }

      - name: Install Windows WDK
        shell: powershell
        run: |
          $exe = "$env:RUNNER_TEMP\wdksetup.exe"

          $p = Start-Process `
            $exe `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "WDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "WDK installation failed"
          }

      - name: Locate x86 kernel headers and libraries
        shell: powershell
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"

          $ntddk = Get-ChildItem `
            "$kits\Include" `
            -Recurse `
            -File `
            -Filter "ntddk.h" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\km\\ntddk\.h$"
            } |
            Select-Object -First 1

          $ntdef = Get-ChildItem `
            "$kits\Include" `
            -Recurse `
            -File `
            -Filter "ntdef.h" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\shared\\ntdef\.h$"
            } |
            Select-Object -First 1

          $ntoskrnl = Get-ChildItem `
            "$kits\Lib" `
            -Recurse `
            -File `
            -Filter "ntoskrnl.lib" |
            Where-Object {
              $_.FullName -match "10\.0\.22621\.0\\km\\x86\\ntoskrnl\.lib$"
            } |
            Select-Object -First 1

          if (-not $ntddk) {
            throw "ntddk.h 22621 not found"
          }

          if (-not $ntdef) {
            throw "ntdef.h 22621 not found"
          }

          if (-not $ntoskrnl) {
            throw "x86 ntoskrnl.lib 22621 not found"
          }

          $kmInclude = Split-Path $ntddk.FullName
          $sharedInclude = Split-Path $ntdef.FullName
          $kmLib = Split-Path $ntoskrnl.FullName

          Write-Host "=== NTDDK ==="
          Write-Host $ntddk.FullName

          Write-Host ""
          Write-Host "=== SHARED ==="
          Write-Host $sharedInclude

          Write-Host ""
          Write-Host "=== NTOSKRNL X86 ==="
          Write-Host $ntoskrnl.FullName

          "KM_INCLUDE=$kmInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SHARED_INCLUDE=$sharedInclude" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "KM_LIB=$kmLib" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate Visual C++ x86 compiler
        shell: powershell
        run: |
          $vswhere =
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual C++ tools not found"
          }

          $vcvars =
            Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"

          if (-not (Test-Path $vcvars)) {
            throw "vcvars32.bat not found"
          }

          Write-Host "=== VCVARS32 ==="
          Write-Host $vcvars

          "VCVARS32=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create read-only Dell SMM driver source
        shell: powershell
        run: |
          $source = @'
          #include <ntddk.h>

          #define DEVICE_NAME L"\Device\DellSmmReadOnly"
          #define DOS_NAME    L"\DosDevices\DellSmmReadOnly"

          #define IOCTL_DELL_GET_FAN0_RPM \
              CTL_CODE(FILE_DEVICE_UNKNOWN, 0x800, METHOD_BUFFERED, FILE_READ_DATA)

          typedef struct _DELL_RPM_RESULT
          {
              ULONG RawEax;
              ULONG Rpm;
              ULONG CarryFlag;
          } DELL_RPM_RESULT, *PDELL_RPM_RESULT;

          DRIVER_INITIALIZE DriverEntry;
          DRIVER_UNLOAD DellUnload;
          DRIVER_DISPATCH DellCreateClose;
          DRIVER_DISPATCH DellUnsupported;
          DRIVER_DISPATCH DellDeviceControl;

          static NTSTATUS
          CompleteIrp(
              PIRP Irp,
              NTSTATUS Status,
              ULONG_PTR Information
              )
          {
              Irp->IoStatus.Status = Status;
              Irp->IoStatus.Information = Information;

              IoCompleteRequest(
                  Irp,
                  IO_NO_INCREMENT
                  );

              return Status;
          }

          /*
           * READ ONLY.
           *
           * Dell legacy SMM:
           * EAX = 0x02A3 -> read fan speed
           * EBX = 0      -> fan number 0
           *
           * There is deliberately NO fan-control command
           * in this driver.
           */
          static ULONG
          DellReadFan0(
              PUCHAR CarryFlag
              )
          {
              ULONG resultEax = 0xFFFFFFFF;
              UCHAR carry = 0xFF;
              KAFFINITY oldAffinity;

              /*
               * Dell legacy SMM must execute on CPU 0.
               */
              oldAffinity =
                  KeSetSystemAffinityThreadEx(
                      (KAFFINITY)1
                      );

              if (KeGetCurrentProcessorNumber() != 0)
              {
                  KeRevertToUserAffinityThreadEx(
                      oldAffinity
                      );

                  *CarryFlag = 0xFE;

                  return 0xFFFFFFFF;
              }

              __asm
              {
                  push ebx
                  push esi
                  push edi

                  mov eax, 02A3h
                  xor ebx, ebx
                  xor ecx, ecx
                  xor edx, edx
                  xor esi, esi
                  xor edi, edi

                  out 0B2h, al
                  out 084h, al

                  setc carry
                  mov resultEax, eax

                  pop edi
                  pop esi
                  pop ebx
              }

              KeRevertToUserAffinityThreadEx(
                  oldAffinity
                  );

              *CarryFlag = carry;

              return resultEax;
          }

          NTSTATUS NTAPI
          DellCreateClose(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              UNREFERENCED_PARAMETER(
                  DeviceObject
                  );

              return CompleteIrp(
                  Irp,
                  STATUS_SUCCESS,
                  0
                  );
          }

          NTSTATUS NTAPI
          DellUnsupported(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              UNREFERENCED_PARAMETER(
                  DeviceObject
                  );

              return CompleteIrp(
                  Irp,
                  STATUS_INVALID_DEVICE_REQUEST,
                  0
                  );
          }

          NTSTATUS NTAPI
          DellDeviceControl(
              PDEVICE_OBJECT DeviceObject,
              PIRP Irp
              )
          {
              PIO_STACK_LOCATION stack;
              ULONG code;

              UNREFERENCED_PARAMETER(
                  DeviceObject
                  );

              stack =
                  IoGetCurrentIrpStackLocation(
                      Irp
                      );

              code =
                  stack->Parameters.DeviceIoControl.IoControlCode;

              if (code == IOCTL_DELL_GET_FAN0_RPM)
              {
                  PDELL_RPM_RESULT result;
                  ULONG raw;
                  ULONG rpm;
                  UCHAR carry = 0;

                  if (
                      stack->Parameters.DeviceIoControl.OutputBufferLength
                      < sizeof(DELL_RPM_RESULT)
                     )
                  {
                      return CompleteIrp(
                          Irp,
                          STATUS_BUFFER_TOO_SMALL,
                          0
                          );
                  }

                  result =
                      (PDELL_RPM_RESULT)
                      Irp->AssociatedIrp.SystemBuffer;

                  raw =
                      DellReadFan0(
                          &carry
                          );

                  rpm =
                      raw & 0xFFFF;

                  result->RawEax =
                      raw;

                  result->Rpm =
                      rpm;

                  result->CarryFlag =
                      carry;

                  /*
                   * Dell/Linux validity checks:
                   *
                   * 1. carry flag must be clear
                   * 2. low 16 bits must not be FFFF
                   * 3. BIOS must change EAX from original 02A3
                   */
                  if (
                      carry != 0 ||
                      rpm == 0xFFFF ||
                      raw == 0x000002A3
                     )
                  {
                      return CompleteIrp(
                          Irp,
                          STATUS_DEVICE_DATA_ERROR,
                          sizeof(DELL_RPM_RESULT)
                          );
                  }

                  return CompleteIrp(
                      Irp,
                      STATUS_SUCCESS,
                      sizeof(DELL_RPM_RESULT)
                      );
              }

              return CompleteIrp(
                  Irp,
                  STATUS_INVALID_DEVICE_REQUEST,
                  0
                  );
          }

          VOID NTAPI
          DellUnload(
              PDRIVER_OBJECT DriverObject
              )
          {
              UNICODE_STRING dosName;

              RtlInitUnicodeString(
                  &dosName,
                  DOS_NAME
                  );

              IoDeleteSymbolicLink(
                  &dosName
                  );

              if (DriverObject->DeviceObject != NULL)
              {
                  IoDeleteDevice(
                      DriverObject->DeviceObject
                      );
              }
          }

          NTSTATUS NTAPI
          DriverEntry(
              PDRIVER_OBJECT DriverObject,
              PUNICODE_STRING RegistryPath
              )
          {
              UNICODE_STRING deviceName;
              UNICODE_STRING dosName;
              PDEVICE_OBJECT deviceObject = NULL;
              NTSTATUS status;
              ULONG i;

              UNREFERENCED_PARAMETER(
                  RegistryPath
                  );

              for (
                  i = 0;
                  i <= IRP_MJ_MAXIMUM_FUNCTION;
                  ++i
                  )
              {
                  DriverObject->MajorFunction[i] =
                      DellUnsupported;
              }

              DriverObject->MajorFunction[IRP_MJ_CREATE] =
                  DellCreateClose;

              DriverObject->MajorFunction[IRP_MJ_CLOSE] =
                  DellCreateClose;

              DriverObject->MajorFunction[IRP_MJ_DEVICE_CONTROL] =
                  DellDeviceControl;

              DriverObject->DriverUnload =
                  DellUnload;

              RtlInitUnicodeString(
                  &deviceName,
                  DEVICE_NAME
                  );

              status =
                  IoCreateDevice(
                      DriverObject,
                      0,
                      &deviceName,
                      FILE_DEVICE_UNKNOWN,
                      FILE_DEVICE_SECURE_OPEN,
                      FALSE,
                      &deviceObject
                      );

              if (!NT_SUCCESS(status))
              {
                  return status;
              }

              deviceObject->Flags |=
                  DO_BUFFERED_IO;

              RtlInitUnicodeString(
                  &dosName,
                  DOS_NAME
                  );

              status =
                  IoCreateSymbolicLink(
                      &dosName,
                      &deviceName
                      );

              if (!NT_SUCCESS(status))
              {
                  IoDeleteDevice(
                      deviceObject
                      );

                  return status;
              }

              deviceObject->Flags &=
                  ~DO_DEVICE_INITIALIZING;

              return STATUS_SUCCESS;
          }
          '@

          $file =
              "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c"

          Set-Content `
            -Path $file `
            -Value $source `
            -Encoding ASCII

          Write-Host "=== SOURCE CREATED ==="

          Get-Item $file |
            Select-Object Name,Length

      - name: Compile and link x86 driver directly
        shell: powershell
        run: |
          $batch =
              "$env:GITHUB_WORKSPACE\build-driver.cmd"

          $content = @"
          @echo off
          setlocal

          call "$env:VCVARS32"

          if errorlevel 1 exit /b 10

          echo.
          echo ===== COMPILER =====
          where cl.exe

          echo.
          echo ===== COMPILE AND LINK =====

          cl.exe ^
            /nologo ^
            /TC ^
            /kernel ^
            /GS- ^
            /Zl ^
            /W3 ^
            /D_X86_=1 ^
            /DWIN32=1 ^
            /D_WIN32_WINNT=0x0601 ^
            /DNTDDI_VERSION=0x06010000 ^
            /I"$env:KM_INCLUDE" ^
            /I"$env:SHARED_INCLUDE" ^
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c" ^
            /link ^
            /DRIVER:WDM ^
            /SUBSYSTEM:NATIVE ^
            /MACHINE:X86 ^
            /ENTRY:DriverEntry ^
            /NODEFAULTLIB ^
            /INCREMENTAL:NO ^
            /OUT:"$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys" ^
            /LIBPATH:"$env:KM_LIB" ^
            ntoskrnl.lib

          if errorlevel 1 exit /b 20

          exit /b 0
          "@

          Set-Content `
            -Path $batch `
            -Value $content `
            -Encoding ASCII

          Write-Host "=== BUILD SCRIPT ==="
          Get-Content $batch

          & cmd.exe /d /c $batch

          $code =
              $LASTEXITCODE

          Write-Host ""
          Write-Host "BUILD EXIT CODE = $code"

          if ($code -ne 0)
          {
              throw "Direct x86 driver build failed"
          }

      - name: Verify generated x86 driver
        shell: powershell
        run: |
          $sys =
              "$env:GITHUB_WORKSPACE\DellSmmReadOnly.sys"

          if (-not (Test-Path $sys))
          {
              throw "SYS driver was not generated"
          }

          $bytes =
              [System.IO.File]::ReadAllBytes(
                  $sys
                  )

          if ($bytes.Length -lt 256)
          {
              throw "SYS driver is unexpectedly small"
          }

          $peOffset =
              [BitConverter]::ToInt32(
                  $bytes,
                  0x3C
                  )

          $machine =
              [BitConverter]::ToUInt16(
                  $bytes,
                  $peOffset + 4
                  )

          Write-Host "=== DRIVER ==="

          Get-Item $sys |
            Select-Object Name,Length

          Write-Host ""
          Write-Host (
              "PE MACHINE = 0x{0:X4}" -f $machine
          )

          if ($machine -ne 0x014C)
          {
              throw "Driver is not x86/i386"
          }

          Write-Host ""
          Write-Host "ARCHITECTURE = x86 / i386 -- CORRECT"

          $hash =
              Get-FileHash `
                  $sys `
                  -Algorithm SHA256

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host $hash.Hash

          $artifact =
              "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force |
            Out-Null

          Copy-Item `
            $sys `
            "$artifact\DellSmmReadOnly.sys"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\DellSmmReadOnly.c" `
            "$artifact\DellSmmReadOnly.c"

          @"
          Dell Studio 1558 experimental read-only driver
          ------------------------------------------------

          Architecture: x86 / i386

          Implemented Dell SMM command:
          0x02A3 = READ FAN SPEED

          Fan speed modification:
          NOT IMPLEMENTED

          BIOS fan-control modification:
          NOT IMPLEMENTED

          SHA256:
          $($hash.Hash)
          "@ |
            Set-Content `
              "$artifact\BUILD-INFO.txt" `
              -Encoding ASCII

      - name: Upload x86 driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: DellSmmReadOnly-x86
          path: artifact
          if-no-files-found: error
