name: Build Dell SMM x86 with EWDK 20348

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022

    steps:
      - name: Download official Microsoft EWDK 20348
        shell: powershell
        run: |
          $iso = "$env:RUNNER_TEMP\EWDK20348.iso"

          Write-Host "Downloading official Microsoft EWDK..."
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/?linkid=2163981" `
            -OutFile $iso

          if (-not (Test-Path $iso)) {
            throw "EWDK ISO download failed"
          }

          $f = Get-Item $iso

          Write-Host "Downloaded:"
          Write-Host $f.FullName
          Write-Host "Size bytes: $($f.Length)"

      - name: Mount EWDK ISO
        shell: powershell
        run: |
          $iso = "$env:RUNNER_TEMP\EWDK20348.iso"

          $image = Mount-DiskImage `
            -ImagePath $iso `
            -PassThru

          Start-Sleep -Seconds 3

          $volume = $image |
            Get-Volume |
            Where-Object { $_.DriveLetter } |
            Select-Object -First 1

          if (-not $volume) {
            throw "Could not determine EWDK drive letter"
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "EWDK mounted as:"
          Write-Host $drive

          if (-not (Test-Path "$drive\LaunchBuildEnv.cmd")) {
            throw "LaunchBuildEnv.cmd not found on EWDK ISO"
          }

          "EWDK_DRIVE=$drive" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Inspect EWDK
        shell: powershell
        run: |
          Write-Host "EWDK drive:"
          Write-Host $env:EWDK_DRIVE

          Write-Host ""
          Write-Host "=== ROOT ==="

          Get-ChildItem "$env:EWDK_DRIVE\" |
            Select-Object Name,Length

          Write-Host ""
          Write-Host "=== LaunchBuildEnv ==="

          Get-Item "$env:EWDK_DRIVE\LaunchBuildEnv.cmd" |
            Select-Object FullName,Length

      - name: Download original Dell SMM driver source
        shell: powershell
        run: |
          git clone --depth 1 `
            https://github.com/424778940z/bzh-windrv-dell-smm-io.git src

          Set-Location src

          Write-Host "Source commit:"
          git rev-parse HEAD

      - name: Build Release Win32 inside EWDK
        shell: powershell
        run: |
          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\bzh_dell_smm_io\bzh_dell_smm_io.vcxproj"

          $batch = Join-Path `
            $env:RUNNER_TEMP `
            "build-ewdk.cmd"

          @"
          @echo off
          call $env:EWDK_DRIVE\LaunchBuildEnv.cmd
          if errorlevel 1 exit /b %errorlevel%

          echo.
          echo ===== MSBUILD LOCATION =====
          where msbuild
          echo.

          echo ===== BUILDING WIN32 DRIVER =====

          msbuild "$project" /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:TargetVersion=Windows10 /p:SignMode=Off /v:minimal

          exit /b %errorlevel%
          "@ | Set-Content `
            -Path $batch `
            -Encoding ASCII

          Write-Host "Running:"
          Get-Content $batch

          & cmd.exe /d /c $batch

          $code = $LASTEXITCODE

          Write-Host ""
          Write-Host "MSBuild exit code: $code"

          if ($code -ne 0) {
            throw "EWDK Win32 driver build failed"
          }

      - name: Find built driver
        shell: powershell
        run: |
          $sysfiles = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\src" `
            -Recurse `
            -File `
            -Filter "*.sys"

          if (-not $sysfiles) {
            throw "No SYS file was produced"
          }

          Write-Host "=== SYS FILES ==="

          $sysfiles |
            Select-Object FullName,Length |
            Format-Table -AutoSize

          New-Item `
            -ItemType Directory `
            -Path "$env:GITHUB_WORKSPACE\artifact" `
            -Force |
            Out-Null

          foreach ($sys in $sysfiles) {
            Copy-Item `
              $sys.FullName `
              "$env:GITHUB_WORKSPACE\artifact" `
              -Force
          }

      - name: Verify x86 PE architecture and SHA256
        shell: powershell
        run: |
          $sysfiles = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\artifact" `
            -Filter "*.sys"

          foreach ($sys in $sysfiles) {

            Write-Host ""
            Write-Host "======================================"
            Write-Host "FILE: $($sys.Name)"
            Write-Host "======================================"

            $bytes = [System.IO.File]::ReadAllBytes($sys.FullName)

            if ($bytes.Length -lt 256) {
              throw "SYS file is unexpectedly small"
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine  = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

            Write-Host ("PE Machine: 0x{0:X4}" -f $machine)

            if ($machine -eq 0x014C) {
              Write-Host "Architecture: x86 / i386 - CORRECT"
            }
            elseif ($machine -eq 0x8664) {
              throw "Driver is x64, not x86"
            }
            else {
              throw ("Unexpected PE machine type: 0x{0:X4}" -f $machine)
            }

            $hash = Get-FileHash `
              $sys.FullName `
              -Algorithm SHA256

            Write-Host ""
            Write-Host "SHA256:"
            Write-Host $hash.Hash
          }

      - name: Upload x86 driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: dell-smm-x86-ewdk20348
          path: artifact
          if-no-files-found: error
