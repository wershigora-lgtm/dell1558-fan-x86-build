name: Build Dell SMM x86 driver

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022

    steps:
      - name: Download Microsoft Windows 10 19041 SDK and WDK
        shell: powershell
        run: |
          Write-Host "Downloading Windows 10 SDK 19041..."
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/?linkid=2311805" `
            -OutFile "$env:TEMP\winsdksetup.exe"

          Write-Host "Downloading Windows 10 WDK 19041..."
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/?linkid=2342425" `
            -OutFile "$env:TEMP\wdksetup.exe"

      - name: Install Windows 10 SDK 19041
        shell: powershell
        run: |
          $p = Start-Process `
            "$env:TEMP\winsdksetup.exe" `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "SDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Windows SDK installation failed"
          }

      - name: Install Windows 10 WDK 19041
        shell: powershell
        run: |
          $p = Start-Process `
            "$env:TEMP\wdksetup.exe" `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru

          Write-Host "WDK exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Windows WDK installation failed"
          }

      - name: Verify kernel headers
        shell: powershell
        run: |
          $ntddk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.19041.0\km\ntddk.h"

          Write-Host "Looking for:"
          Write-Host $ntddk

          if (-not (Test-Path $ntddk)) {
            Write-Host "Contents of Windows Kits Include:"
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" `
              -Recurse `
              -Filter "ntddk.h" `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            throw "ntddk.h for WDK 19041 not found"
          }

          Write-Host "SUCCESS: ntddk.h found."
          Get-Item $ntddk | Select-Object FullName,Length

      - name: Download original Dell SMM driver source
        shell: powershell
        run: |
          git clone --depth 1 `
            https://github.com/424778940z/bzh-windrv-dell-smm-io.git src

          Set-Location src

          Write-Host "Source commit:"
          git rev-parse HEAD

      - name: Build Release Win32 for Windows 10
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild not found"
          }

          Write-Host "Using MSBuild:"
          Write-Host $msbuild

          $project = "src\bzh_dell_smm_io\bzh_dell_smm_io.vcxproj"

          & $msbuild `
            $project `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:TargetVersion=Windows10 `
            /p:WindowsTargetPlatformVersion=10.0.19041.0 `
            /p:_NT_TARGET_VERSION=0x0A000008 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed"
          }

      - name: Collect and verify x86 driver
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null

          $files = Get-ChildItem src -Recurse -File |
            Where-Object {
              $_.Extension -in ".sys", ".inf", ".cat", ".pdb"
            }

          Write-Host "=== BUILD OUTPUT FILES ==="

          $files |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $sysfiles = $files |
            Where-Object { $_.Extension -eq ".sys" }

          if (-not $sysfiles) {
            throw "No .sys driver produced"
          }

          foreach ($file in $files) {
            Copy-Item $file.FullName artifact -Force
          }

          Write-Host ""
          Write-Host "=== SHA256 ==="

          Get-ChildItem artifact -Filter *.sys |
            Get-FileHash -Algorithm SHA256 |
            Format-Table Path,Hash -AutoSize

          Write-Host ""
          Write-Host "=== PE ARCHITECTURE ==="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $dumpbin = & $vswhere `
            -latest `
            -products * `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x86\dumpbin.exe" |
            Select-Object -First 1

          if ($dumpbin) {
            foreach ($sys in (Get-ChildItem artifact -Filter *.sys)) {
              Write-Host "FILE: $($sys.Name)"
              & $dumpbin /headers $sys.FullName |
                Select-String "machine"
            }
          }

      - name: Upload x86 driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: dell-smm-x86-release
          path: artifact
          if-no-files-found: error
