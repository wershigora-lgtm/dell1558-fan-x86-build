name: Build Dell Fan Control FINAL x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "DellFanControl.c"
      - "DellFanControlApp.c"
      - ".github/workflows/build-x86.yml"

jobs:
  build-x86:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official Microsoft SDK and WDK 22621
        shell: powershell
        run: |
          $sdk = "$env:RUNNER_TEMP\winsdksetup.exe"
          $wdk = "$env:RUNNER_TEMP\wdksetup.exe"

          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/cb9de490-6e67-4ac6-8c2c-6dfabb824e8a/windowssdk/winsdksetup.exe" `
            -o $sdk
          if ($LASTEXITCODE -ne 0) { throw "SDK download failed" }

          & curl.exe `
            -L `
            --fail `
            --retry 3 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            "https://download.microsoft.com/download/03f059f8-d6a3-4b9c-b85b-95cc401be222/wdk/wdksetup.exe" `
            -o $wdk
          if ($LASTEXITCODE -ne 0) { throw "WDK download failed" }

      - name: Install Windows SDK
        shell: powershell
        run: |
          $p = Start-Process `
            "$env:RUNNER_TEMP\winsdksetup.exe" `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "SDK installation failed: $($p.ExitCode)"
          }

      - name: Install Windows WDK
        shell: powershell
        run: |
          $p = Start-Process `
            "$env:RUNNER_TEMP\wdksetup.exe" `
            -ArgumentList "/Features","+","/Quiet","/NoRestart" `
            -Wait `
            -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "WDK installation failed: $($p.ExitCode)"
          }

      - name: Locate x86 toolchain
        shell: powershell
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"

          $ntddk = Get-ChildItem "$kits\Include" -Recurse -File -Filter ntddk.h |
            Where-Object { $_.FullName -match "10\.0\.22621\.0\\km\\ntddk\.h$" } |
            Select-Object -First 1

          $ntdef = Get-ChildItem "$kits\Include" -Recurse -File -Filter ntdef.h |
            Where-Object { $_.FullName -match "10\.0\.22621\.0\\shared\\ntdef\.h$" } |
            Select-Object -First 1

          $ntoskrnl = Get-ChildItem "$kits\Lib" -Recurse -File -Filter ntoskrnl.lib |
            Where-Object { $_.FullName -match "10\.0\.22621\.0\\km\\x86\\ntoskrnl\.lib$" } |
            Select-Object -First 1

          if (-not $ntddk) { throw "ntddk.h 22621 not found" }
          if (-not $ntdef) { throw "ntdef.h 22621 not found" }
          if (-not $ntoskrnl) { throw "x86 ntoskrnl.lib 22621 not found" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "Visual C++ tools not found" }

          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars32.bat not found" }

          "KM_INCLUDE=$(Split-Path $ntddk.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SHARED_INCLUDE=$(Split-Path $ntdef.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "KM_LIB=$(Split-Path $ntoskrnl.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VCVARS32=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile final x86 driver
        shell: powershell
        run: |
          $batch = "$env:GITHUB_WORKSPACE\compile-driver.cmd"
          $content = @"
          @echo off
          setlocal
          call "$env:VCVARS32"
          if errorlevel 1 exit /b 10

          cl.exe ^
            /nologo ^
            /c ^
            /TC ^
            /Gz ^
            /kernel ^
            /GS- ^
            /Zl ^
            /W3 ^
            /D_X86_=1 ^
            /DWIN32=1 ^
            /D_WIN32_WINNT=0x0601 ^
            /DNTDDI_VERSION=0x06010000 ^
            /I"$env:KM_INCLUDE" ^
            /I"$env:SHARED_INCLUDE" ^
            "$env:GITHUB_WORKSPACE\DellFanControl.c" ^
            /Fo:"$env:GITHUB_WORKSPACE\DellFanControl.obj"
          if errorlevel 1 exit /b 20

          dumpbin.exe /symbols "$env:GITHUB_WORKSPACE\DellFanControl.obj" ^
            | findstr /C:"_DriverEntry@8"
          if errorlevel 1 exit /b 21
          exit /b 0
          "@
          Set-Content $batch $content -Encoding ASCII
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw "Driver compile failed: $LASTEXITCODE" }

      - name: Link final x86 driver
        shell: powershell
        run: |
          $batch = "$env:GITHUB_WORKSPACE\link-driver.cmd"
          $content = @"
          @echo off
          setlocal
          call "$env:VCVARS32"
          if errorlevel 1 exit /b 10

          link.exe ^
            /nologo ^
            /DRIVER:WDM ^
            /SUBSYSTEM:NATIVE ^
            /MACHINE:X86 ^
            /ENTRY:DriverEntry@8 ^
            /NODEFAULTLIB ^
            /INCREMENTAL:NO ^
            /OUT:"$env:GITHUB_WORKSPACE\DellFanControl.sys" ^
            /LIBPATH:"$env:KM_LIB" ^
            "$env:GITHUB_WORKSPACE\DellFanControl.obj" ^
            ntoskrnl.lib
          if errorlevel 1 exit /b 20
          exit /b 0
          "@
          Set-Content $batch $content -Encoding ASCII
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw "Driver link failed: $LASTEXITCODE" }

      - name: Compile x86 controller
        shell: powershell
        run: |
          $batch = "$env:GITHUB_WORKSPACE\compile-app.cmd"
          $content = @"
          @echo off
          setlocal
          call "$env:VCVARS32"
          if errorlevel 1 exit /b 10

          cl.exe ^
            /nologo ^
            /TC ^
            /O2 ^
            /W3 ^
            /MT ^
            /D_WIN32_WINNT=0x0601 ^
            "$env:GITHUB_WORKSPACE\DellFanControlApp.c" ^
            /link ^
            /SUBSYSTEM:CONSOLE ^
            /MACHINE:X86 ^
            /OUT:"$env:GITHUB_WORKSPACE\DellFanControl.exe"
          if errorlevel 1 exit /b 20
          exit /b 0
          "@
          Set-Content $batch $content -Encoding ASCII
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw "Controller compile failed: $LASTEXITCODE" }

      - name: Verify binaries and create package
        shell: powershell
        run: |
          $sys = "$env:GITHUB_WORKSPACE\DellFanControl.sys"
          $exe = "$env:GITHUB_WORKSPACE\DellFanControl.exe"

          foreach ($file in @($sys, $exe)) {
            if (-not (Test-Path $file)) { throw "Missing output: $file" }
            $bytes = [System.IO.File]::ReadAllBytes($file)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x014C) { throw "$file is NOT x86/i386" }
          }

          $sysHash = (Get-FileHash $sys -Algorithm SHA256).Hash
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $artifact = "$env:GITHUB_WORKSPACE\artifact"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null

          Copy-Item $sys "$artifact\DellFanControl.sys"
          Copy-Item $exe "$artifact\DellFanControl.exe"
          Copy-Item "$env:GITHUB_WORKSPACE\DellFanControl.c" "$artifact\DellFanControl.c"
          Copy-Item "$env:GITHUB_WORKSPACE\DellFanControlApp.c" "$artifact\DellFanControlApp.c"

          @'
          @echo off
          setlocal

          net session >nul 2>&1
          if errorlevel 1 (
            echo ERROR: Run INSTALL.cmd as Administrator.
            pause
            exit /b 1
          )

          set "DEST=C:\DellFanControl"
          if not exist "%DEST%" mkdir "%DEST%"

          copy /Y "%~dp0DellFanControl.sys" "%DEST%\DellFanControl.sys" >nul
          copy /Y "%~dp0DellFanControl.exe" "%DEST%\DellFanControl.exe" >nul

          sc.exe query DellFanControl >nul 2>&1
          if not errorlevel 1 (
            sc.exe stop DellFanControl >nul 2>&1
            sc.exe delete DellFanControl >nul 2>&1
            timeout /t 1 /nobreak >nul
          )

          sc.exe create DellFanControl type= kernel start= auto binPath= C:\DellFanControl\DellFanControl.sys
          if errorlevel 1 (
            echo ERROR: Could not create DellFanControl service.
            pause
            exit /b 2
          )

          sc.exe start DellFanControl
          if errorlevel 1 (
            echo ERROR: Driver did not start.
            echo Reboot once, then run START-CONTROL.cmd as Administrator.
            pause
            exit /b 3
          )

          echo DellFanControl driver installed and running.
          echo Run START-CONTROL.cmd as Administrator.
          pause
          '@ | Set-Content "$artifact\INSTALL.cmd" -Encoding ASCII

          @'
          @echo off
          net session >nul 2>&1
          if errorlevel 1 (
            echo ERROR: Run START-CONTROL.cmd as Administrator.
            pause
            exit /b 1
          )
          sc.exe start DellFanControl >nul 2>&1
          C:\DellFanControl\DellFanControl.exe
          '@ | Set-Content "$artifact\START-CONTROL.cmd" -Encoding ASCII

          @'
          @echo off
          net session >nul 2>&1
          if errorlevel 1 (
            echo ERROR: Run UNINSTALL.cmd as Administrator.
            pause
            exit /b 1
          )
          sc.exe stop DellFanControl >nul 2>&1
          sc.exe delete DellFanControl >nul 2>&1
          echo DellFanControl service removed.
          echo Reboot before deleting C:\DellFanControl if the SYS file is still locked.
          pause
          '@ | Set-Content "$artifact\UNINSTALL.cmd" -Encoding ASCII

          @"
          Dell Studio 1558 FINAL Fan Control
          ==================================

          Driver: DellFanControl.sys
          Controller: DellFanControl.exe
          Architecture: x86 / i386
          Driver entry point: DriverEntry@8

          Safety:
          - fan state 0 / OFF is blocked in the driver
          - only LOW (1) and HIGH (2) are writable
          - BIOS automatic-control disable commands are not implemented
          - BIOS remains active at all times
          - HOLD-LOW and TARGET modes require valid temperature telemetry
          - at 85 C the controller requests HIGH and returns to AUTO
          - loss of temperature telemetry for 3 scans also returns to AUTO
          - closing the controller stops LOW override pulses

          Controls:
          A       AUTO
          L       HOLD-LOW
          T       TARGET-RPM
          + / -   target RPM +/- 100
          ] / [   pulse interval +/- 25 ms (50..1000 ms)
          2       HIGH once, then AUTO
          H       help
          Q       HIGH once and quit

          Default pulse interval: 100 ms
          Temperature safety limit: 85 C

          DellFanControl.sys SHA256:
          $sysHash

          DellFanControl.exe SHA256:
          $exeHash
          "@ | Set-Content "$artifact\BUILD-INFO.txt" -Encoding ASCII

          Write-Host "DellFanControl.sys SHA256 = $sysHash"
          Write-Host "DellFanControl.exe SHA256 = $exeHash"

      - name: Upload final Dell Fan Control package
        uses: actions/upload-artifact@v4
        with:
          name: DellFanControl-FINAL-x86
          path: artifact
          if-no-files-found: error
