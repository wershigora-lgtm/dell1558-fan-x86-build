name: Build Dell SMM x86 - Microsoft NuGet layout

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022

    steps:
      - name: Download NuGet
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile "$env:GITHUB_WORKSPACE\nuget.exe"

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\nuget.exe")) {
            throw "nuget.exe download failed"
          }

      - name: Download Microsoft x86 WDK and dependencies
        shell: powershell
        run: |
          $nuget = "$env:GITHUB_WORKSPACE\nuget.exe"
          $packages = "$env:GITHUB_WORKSPACE\packages"

          & $nuget install Microsoft.Windows.WDK.x86 `
            -Version 10.0.26100.6584 `
            -DependencyVersion Highest `
            -OutputDirectory $packages `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet WDK download failed"
          }

          Write-Host ""
          Write-Host "=== INSTALLED PACKAGES ==="

          Get-ChildItem $packages -Directory |
            Select-Object Name |
            Format-Table -AutoSize

      - name: Locate exact Microsoft build files
        shell: powershell
        run: |
          $packages = "$env:GITHUB_WORKSPACE\packages"

          $wdkDir = Get-ChildItem $packages -Directory |
            Where-Object { $_.Name -like "Microsoft.Windows.WDK.x86.*" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          $sdkX86Dir = Get-ChildItem $packages -Directory |
            Where-Object { $_.Name -like "Microsoft.Windows.SDK.CPP.x86.*" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          $sdkCommonDir = Get-ChildItem $packages -Directory |
            Where-Object {
              $_.Name -like "Microsoft.Windows.SDK.CPP.*" -and
              $_.Name -notlike "Microsoft.Windows.SDK.CPP.x86.*" -and
              $_.Name -notlike "Microsoft.Windows.SDK.CPP.x64.*" -and
              $_.Name -notlike "Microsoft.Windows.SDK.CPP.arm*"
            } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $wdkDir) {
            throw "Microsoft.Windows.WDK.x86 package directory not found"
          }

          if (-not $sdkX86Dir) {
            throw "Microsoft.Windows.SDK.CPP.x86 package directory not found"
          }

          if (-not $sdkCommonDir) {
            throw "Microsoft.Windows.SDK.CPP common package directory not found"
          }

          $wdkProps = Join-Path `
            $wdkDir.FullName `
            "build\native\Microsoft.Windows.WDK.x86.props"

          $sdkX86Props = Join-Path `
            $sdkX86Dir.FullName `
            "build\native\Microsoft.Windows.SDK.cpp.x86.props"

          $sdkCommonProps = Join-Path `
            $sdkCommonDir.FullName `
            "build\native\Microsoft.Windows.SDK.cpp.props"

          $sdkCommonTargets = Join-Path `
            $sdkCommonDir.FullName `
            "build\native\Microsoft.Windows.SDK.cpp.targets"

          Write-Host "=== WDK x86 PROPS ==="
          Write-Host $wdkProps
          Write-Host (Test-Path $wdkProps)

          Write-Host ""
          Write-Host "=== SDK x86 PROPS ==="
          Write-Host $sdkX86Props
          Write-Host (Test-Path $sdkX86Props)

          Write-Host ""
          Write-Host "=== SDK COMMON PROPS ==="
          Write-Host $sdkCommonProps
          Write-Host (Test-Path $sdkCommonProps)

          Write-Host ""
          Write-Host "=== SDK COMMON TARGETS ==="
          Write-Host $sdkCommonTargets
          Write-Host (Test-Path $sdkCommonTargets)

          if (-not (Test-Path $wdkProps)) {
            throw "WDK x86 props not found"
          }

          if (-not (Test-Path $sdkX86Props)) {
            throw "SDK x86 props not found"
          }

          if (-not (Test-Path $sdkCommonProps)) {
            throw "SDK common props not found"
          }

          if (-not (Test-Path $sdkCommonTargets)) {
            throw "SDK common targets not found"
          }

          "WDK_X86_PROPS=$wdkProps" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SDK_X86_PROPS=$sdkX86Props" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SDK_COMMON_PROPS=$sdkCommonProps" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "SDK_COMMON_TARGETS=$sdkCommonTargets" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify kernel headers
        shell: powershell
        run: |
          $packages = "$env:GITHUB_WORKSPACE\packages"

          $ntddk = Get-ChildItem $packages `
            -Recurse `
            -File `
            -Filter "ntddk.h" |
            Select-Object -First 1

          if (-not $ntddk) {
            throw "ntddk.h not found"
          }

          Write-Host "=== NTDDK.H ==="
          Write-Host $ntddk.FullName

          $wdf = Get-ChildItem $packages `
            -Recurse `
            -File `
            -Filter "wdf*.lib" |
            Where-Object {
              $_.FullName -match "\\x86\\" -or
              $_.FullName -match "\\i386\\"
            } |
            Select-Object -First 20

          Write-Host ""
          Write-Host "=== X86 WDF LIBRARIES ==="

          $wdf |
            Select-Object FullName |
            Format-Table -AutoSize

      - name: Download original Dell SMM driver source
        shell: powershell
        run: |
          git clone --depth 1 `
            https://github.com/424778940z/bzh-windrv-dell-smm-io.git `
            src

          Set-Location src

          Write-Host "=== ORIGINAL SOURCE COMMIT ==="
          git rev-parse HEAD

      - name: Create Microsoft-style WDK NuGet imports
        shell: powershell
        run: |
          $propsPath = "$env:GITHUB_WORKSPACE\src\Directory.Build.props"
          $targetsPath = "$env:GITHUB_WORKSPACE\src\Directory.Build.targets"

          $props = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <PropertyGroup>
              <WindowsTargetPlatformVersion>10.0.26100.0</WindowsTargetPlatformVersion>
              <TargetFramework>native</TargetFramework>
              <_NuGetTargetFallbackMoniker>$(_NuGetTargetFallbackMoniker);native,Version=v0.0</_NuGetTargetFallbackMoniker>
              <RestorePackages>true</RestorePackages>
            </PropertyGroup>

            <Import Project="__SDK_COMMON_PROPS__" />
            <Import Project="__SDK_X86_PROPS__" />
            <Import Project="__WDK_X86_PROPS__" />
          </Project>
          '@

          $props = $props.Replace(
            "__SDK_COMMON_PROPS__",
            $env:SDK_COMMON_PROPS
          )

          $props = $props.Replace(
            "__SDK_X86_PROPS__",
            $env:SDK_X86_PROPS
          )

          $props = $props.Replace(
            "__WDK_X86_PROPS__",
            $env:WDK_X86_PROPS
          )

          $props |
            Set-Content `
              -Path $propsPath `
              -Encoding UTF8

          $targets = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="__SDK_COMMON_TARGETS__" />
          </Project>
          '@

          $targets = $targets.Replace(
            "__SDK_COMMON_TARGETS__",
            $env:SDK_COMMON_TARGETS
          )

          $targets |
            Set-Content `
              -Path $targetsPath `
              -Encoding UTF8

          Write-Host "=== Directory.Build.props ==="
          Get-Content $propsPath

          Write-Host ""
          Write-Host "=== Directory.Build.targets ==="
          Get-Content $targetsPath

      - name: Build Release Win32
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild not found"
          }

          Write-Host "=== MSBUILD ==="
          Write-Host $msbuild

          $project = "$env:GITHUB_WORKSPACE\src\bzh_dell_smm_io\bzh_dell_smm_io.vcxproj"

          Write-Host ""
          Write-Host "=== PROJECT ==="
          Write-Host $project

          & $msbuild `
            $project `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:TargetVersion=Windows10 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:SignMode=Off `
            /v:minimal

          $code = $LASTEXITCODE

          Write-Host ""
          Write-Host "MSBuild exit code: $code"

          if ($code -ne 0) {
            throw "x86 driver build failed"
          }

      - name: Collect and verify x86 driver
        shell: powershell
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Path $artifact `
            -Force |
            Out-Null

          $sysfiles = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\src" `
            -Recurse `
            -File `
            -Filter "*.sys"

          if (-not $sysfiles) {
            throw "No SYS driver produced"
          }

          Write-Host "=== SYS FILES ==="

          $sysfiles |
            Select-Object FullName,Length |
            Format-Table -AutoSize

          foreach ($sys in $sysfiles) {
            Copy-Item `
              $sys.FullName `
              $artifact `
              -Force
          }

          foreach ($sys in (Get-ChildItem $artifact -Filter "*.sys")) {

            Write-Host ""
            Write-Host "======================================"
            Write-Host "FILE: $($sys.Name)"
            Write-Host "======================================"

            $bytes = [System.IO.File]::ReadAllBytes($sys.FullName)

            $peOffset = [BitConverter]::ToInt32(
              $bytes,
              0x3C
            )

            $machine = [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )

            Write-Host ("PE machine: 0x{0:X4}" -f $machine)

            if ($machine -eq 0x014C) {
              Write-Host "Architecture: x86 / i386 -- CORRECT"
            }
            elseif ($machine -eq 0x8664) {
              throw "Built driver is x64, not x86"
            }
            else {
              throw ("Unexpected PE machine type: 0x{0:X4}" -f $machine)
            }

            $hash = Get-FileHash `
              $sys.FullName `
              -Algorithm SHA256

            Write-Host "SHA256:"
            Write-Host $hash.Hash
          }

      - name: Upload x86 driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: dell-smm-x86-release
          path: artifact
          if-no-files-found: error
